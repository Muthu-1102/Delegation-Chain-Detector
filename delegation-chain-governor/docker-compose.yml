version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcg_user
      POSTGRES_PASSWORD: dcg_password
      POSTGRES_DB: dcg_db
    ports:
      - "5432:5432"
    volumes:
      - dcg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcg_user -d dcg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dcg-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dcg_user:dcg_password@postgres:5432/dcg_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dcg-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dcg_postgres_data:
