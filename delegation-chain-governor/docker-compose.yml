version: "3.9"

# No local `postgres` service -- this project uses Supabase as its
# database. `backend/.env`'s DATABASE_URL points directly at Supabase;
# see backend/app/db/session.py for the pgbouncer/asyncpg compatibility
# handling if you're on Supabase's transaction-mode pooler (port 6543).

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dcg-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dcg-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # NOTE: still serving via `vite dev` (docker/Dockerfile.frontend unchanged
    # in this pass). Phase 5 will replace this with a static build served by
    # nginx behind TLS -- do not ship the dev server to production as-is.